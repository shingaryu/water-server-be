      return wrapped[play].map(escapeHtml).join('<br>');
    }

    function exportCsv() {
      const baseHeader = ['試合', '時刻', 'プレーヤー', 'プレー', 'コース', '結果', '得点', '失点'];
      const header = REQUESTED_GROUP_NAME ? ['グループ'].concat(baseHeader) : baseHeader;
      const rows = state.records.map((record) => {
        const match = state.matches.find((item) => item.id === record.matchId);
        const normalized = normalizeRecordClassification(record);
        const point = normalized.result === '得点' ? 1 : 0;
        const lost = normalized.result === '失点' ? 1 : 0;
        const row = [
          match ? match.name : record.matchId,
          formatDateTime(record.timestamp),
          normalized.player,
          normalized.play,
          normalized.course,
          normalized.result,
          point,
          lost,
        ];
        return REQUESTED_GROUP_NAME ? [REQUESTED_GROUP_NAME].concat(row) : row;
      });
      const csv = [header].concat(rows)
        .map((row) => row.map(csvCell).join(','))
        .join('\n');
      downloadFile(`badminton-records-${fileScope()}${toDateInputValue(new Date())}.csv`, csv, 'text/csv;charset=utf-8');
    }

    function exportJson() {
      const payload = {
        ...state,
        scorebookGroup: REQUESTED_GROUP_NAME || undefined,
        exportType: REQUESTED_GROUP_NAME ? 'scopedScorebook' : undefined,
        exportedAt: new Date().toISOString(),
      };
      downloadFile(`badminton-scorebook-${fileScope()}${toDateInputValue(new Date())}.json`, JSON.stringify(payload, null, 2), 'application/json');
    }

    function importJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result));
          state.players = normalizeList(imported.players, DEFAULT_PLAYERS);
          state.plays = ensureDefaultPlays(normalizeList(imported.plays, DEFAULT_PLAYS));
          state.matches = Array.isArray(imported.matches) && imported.matches.length > 0
            ? imported.matches.map((match, index) => normalizeMatch(match, state.players, index))
            : createInitialState().matches;
          state.activeMatchId = state.matches.some((match) => match.id === imported.activeMatchId)
            ? imported.activeMatchId
            : state.matches[0].id;
          state.records = normalizeRecords(imported.records);
          saveState();
          renderAll();
        } catch (error) {
          alert('JSONを読み込めませんでした。');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function makeId(prefix) {
      if (window.crypto && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function formatTime(value) {
      return new Intl.DateTimeFormat('ja-JP', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      }).format(new Date(value));
    }

    function formatDateTime(value) {
      return new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      }).format(new Date(value));
    }

    function formatMatchDate(value) {
      if (!value) return '-';
      return new Intl.DateTimeFormat('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(new Date(`${value}T00:00:00`));
    }

    function toDateInputValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeGroupName(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').slice(0, 80);
    }

    function slugifyStorageScope(value) {
      const slug = normalizeGroupName(value)
        .toLowerCase()
        .normalize('NFKC')
        .replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 80);
      return slug || 'group';
    }

    function fileScope() {
      return REQUESTED_GROUP_NAME ? `${safeFilePart(REQUESTED_GROUP_NAME)}-` : '';
    }

    function safeFilePart(value) {
      return slugifyStorageScope(value).slice(0, 60) || 'group';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }
  </script>
</body>
